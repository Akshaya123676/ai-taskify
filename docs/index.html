<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Taskify</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg">
<div class="container">

<a class="navbar-brand logo" href="#">
🤖 AI Taskify
</a>

<button class="btn btn-glow">
🚀 Stay Productive
</button>

</div>
</nav>


<section class="hero container">

<div class="row align-items-center">

<div class="col-md-6">

<p class="tag">
👋 Welcome Back
</p>

<h1>
Organize Smarter,<br>
<span>Achieve More</span>
</h1>

<p class="hero-text">
Your AI powered To-Do app to manage tasks and boost productivity.
</p>

<div class="cards">

<div class="mini-card">
⚡ Fast & Easy
</div>

<div class="mini-card">
🧠 AI Inspired
</div>

<div class="mini-card">
📈 Track Progress
</div>

</div>

</div>


<div class="col-md-6 text-center">

<div class="robot">
🤖
</div>

</div>

</div>

</section>


<div class="container">

<div class="todo-box">

<h2>📝 My To-Do List</h2>

<p id="date"></p>


<div class="input-group mb-4">

<input
type="text"
id="taskInput"
class="form-control"
placeholder="What needs to be done?">

<button
class="btn add-btn"
onclick="addTask()">

+ Add Task
</button>

</div>


<div class="status">

<div class="status-box">
Total:
<span id="counter">0</span>
</div>

<button
class="btn btn-danger"
onclick="clearAll()">

Clear All
</button>

</div>

<ul id="taskList"></ul>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
